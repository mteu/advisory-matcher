name: Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  # Job: Create release
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-notes-url: ${{ steps.create-release.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Create release
      - name: Create release
        id: create-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
